version: '3.8'

services:
  turbodynamo:
    build: .
    container_name: turbodynamo
    ports:
      - "9000:9000"
    environment:
      # Node Configuration
      - TURBODYNAMO_NODE_ID=node-1
      - TURBODYNAMO_HTTP_PORT=9000
      - TURBODYNAMO_DATA_DIR=/data
      
      # Cluster Configuration (Disabled for standalone)
      - TURBODYNAMO_CLUSTER_ENABLED=false
      
      # Resource Management
      - GOMAXPROCS=4
      - GOMEMLIMIT=2GiB
    volumes:
      - turbodynamo-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  turbodynamo-data:
