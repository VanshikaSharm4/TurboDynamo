version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - bodyclose
    - noctx
    - prealloc
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, govet, noctx]
      - path: cmd/
        linters: [noctx]
formatters:
  enable: [gofmt, goimports]
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
