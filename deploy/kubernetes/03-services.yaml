apiVersion: v1
kind: Service
metadata:
  name: turbodynamo
  namespace: turbodynamo
spec:
  clusterIP: None
  selector:
    app: turbodynamo
  ports:
  - name: http
    port: 9000
    targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: turbodynamo-http
  namespace: turbodynamo
spec:
  type: LoadBalancer
  selector:
    app: turbodynamo
  ports:
  - name: http
    port: 80
    targetPort: 9000
