version: '3.8'

services:
  node1:
    build: .
    container_name: turbodynamo-node1
    ports:
      - "9001:9000"
    environment:
      - TURBODYNAMO_NODE_ID=node1
      - TURBODYNAMO_HTTP_PORT=9000
      - TURBODYNAMO_CLUSTER_ENABLED=true
      - TURBODYNAMO_CLUSTER_PEERS=http://node2:9000,http://node3:9000
      - TURBODYNAMO_QUORUM_SIZE=2
      - TURBODYNAMO_READ_QUORUM=2
      - TURBODYNAMO_DATA_DIR=/data
    volumes:
      - turbodynamo-node1-data:/data
    restart: unless-stopped

  node2:
    build: .
    container_name: turbodynamo-node2
    ports:
      - "9002:9000"
    environment:
      - TURBODYNAMO_NODE_ID=node2
      - TURBODYNAMO_HTTP_PORT=9000
      - TURBODYNAMO_CLUSTER_ENABLED=true
      - TURBODYNAMO_CLUSTER_PEERS=http://node1:9000,http://node3:9000
      - TURBODYNAMO_QUORUM_SIZE=2
      - TURBODYNAMO_READ_QUORUM=2
      - TURBODYNAMO_DATA_DIR=/data
    volumes:
      - turbodynamo-node2-data:/data
    restart: unless-stopped

  node3:
    build: .
    container_name: turbodynamo-node3
    ports:
      - "9003:9000"
    environment:
      - TURBODYNAMO_NODE_ID=node3
      - TURBODYNAMO_HTTP_PORT=9000
      - TURBODYNAMO_CLUSTER_ENABLED=true
      - TURBODYNAMO_CLUSTER_PEERS=http://node1:9000,http://node2:9000
      - TURBODYNAMO_QUORUM_SIZE=2
      - TURBODYNAMO_READ_QUORUM=2
      - TURBODYNAMO_DATA_DIR=/data
    volumes:
      - turbodynamo-node3-data:/data
    restart: unless-stopped

volumes:
  turbodynamo-node1-data:
  turbodynamo-node2-data:
  turbodynamo-node3-data:
